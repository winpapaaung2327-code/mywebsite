<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For My Love ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;

            background:
                radial-gradient(circle at center, #5c0715 0%, #25030a 45%, #090106 100%);

            font-family: Georgia, "Times New Roman", serif;
            color: white;
        }

        /* Background glow */
        .glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;

            background: rgba(255, 20, 60, 0.12);
            filter: blur(80px);

            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% {
                transform: scale(0.9);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.15);
                opacity: 0.9;
            }
        }

        /* Main content */
        .container {
            position: relative;
            z-index: 5;

            width: 100%;
            text-align: center;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 20px;
        }

        .small-text {
            font-size: 18px;
            letter-spacing: 5px;
            text-transform: uppercase;

            color: #f8b6c1;

            margin-bottom: 25px;

            animation: fadeDown 2s ease forwards;
        }

        h1 {
            font-size: clamp(38px, 7vw, 72px);
            font-weight: normal;
            letter-spacing: 3px;

            margin-bottom: 10px;

            text-shadow:
                0 0 10px rgba(255, 80, 100, 0.7),
                0 0 30px rgba(255, 30, 60, 0.4);

            animation: fadeDown 2s ease forwards;
        }

        .subtitle {
            font-size: 20px;
            color: #ffd7dd;

            letter-spacing: 2px;

            margin-bottom: 45px;

            animation: fadeUp 2s ease forwards;
        }

        /* 3D Heart */
        .heart-wrapper {
            position: relative;

            width: 220px;
            height: 220px;

            display: flex;
            justify-content: center;
            align-items: center;

            cursor: pointer;

            perspective: 800px;

            animation: heartAppear 2s ease forwards;
        }

        .heart {
            position: relative;

            width: 130px;
            height: 130px;

            background: linear-gradient(
                145deg,
                #ff4d6d,
                #d90429 45%,
                #8b0018
            );

            transform: rotate(-45deg);

            border-radius: 18px;

            box-shadow:
                -15px 15px 25px rgba(0, 0, 0, 0.5),
                inset 8px 8px 15px rgba(255, 255, 255, 0.25),
                inset -10px -10px 20px rgba(70, 0, 10, 0.5),

                0 0 35px rgba(255, 0, 50, 0.7);

            animation: heartbeat 1.5s ease-in-out infinite;

            transition: transform 0.4s ease;
        }

        .heart::before,
        .heart::after {
            content: "";

            position: absolute;

            width: 130px;
            height: 130px;

            border-radius: 50%;

            background: inherit;

            box-shadow: inherit;
        }

        .heart::before {
            top: -65px;
            left: 0;
        }

        .heart::after {
            left: 65px;
            top: 0;
        }

        /* Heart highlight */
        .heart-highlight {
            position: absolute;

            width: 35px;
            height: 18px;

            background: rgba(255, 255, 255, 0.35);

            border-radius: 50%;

            top: 42px;
            left: 55px;

            transform: rotate(-45deg);

            filter: blur(2px);

            z-index: 3;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: rotate(-45deg) scale(1);
            }

            50% {
                transform: rotate(-45deg) scale(1.08);
            }
        }

        @keyframes heartAppear {
            from {
                opacity: 0;
                transform: scale(0.3);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .click-text {
            margin-top: 35px;

            font-size: 16px;

            color: #f7c6ce;

            letter-spacing: 2px;

            animation:
                fadeUp 2s ease forwards,
                blink 2s ease-in-out infinite;

            animation-delay: 0s, 2s;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }
        }

        /* Floating hearts */
        .floating-heart {
            position: absolute;

            color: rgba(255, 120, 140, 0.65);

            font-size: 20px;

            pointer-events: none;

            animation: floatHeart linear infinite;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(110vh) rotate(0deg);
                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            85% {
                opacity: 1;
            }

            100% {
                transform: translateY(-120px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Music button */
        .music-button {
            position: fixed;

            right: 25px;
            bottom: 25px;

            z-index: 20;

            width: 50px;
            height: 50px;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,0.3);

            background: rgba(80, 0, 20, 0.7);

            color: white;

            font-size: 21px;

            cursor: pointer;

            backdrop-filter: blur(10px);

            transition: 0.3s;
        }

        .music-button:hover {
            transform: scale(1.1);
            background: rgba(150, 0, 35, 0.8);
        }

        /* Page transition */
        .fade-out {
            animation: pageFade 1s ease forwards;
        }

        @keyframes pageFade {
            to {
                opacity: 0;
                transform: scale(1.05);
            }
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile */
        @media (max-width: 600px) {

            .heart-wrapper {
                width: 180px;
                height: 180px;
            }

            .heart {
                width: 105px;
                height: 105px;
            }

            .heart::before,
            .heart::after {
                width: 105px;
                height: 105px;
            }

            .heart::before {
                top: -52px;
            }

            .heart::after {
                left: 52px;
            }

            .heart-highlight {
                top: 35px;
                left: 45px;
            }

            .small-text {
                font-size: 13px;
                letter-spacing: 3px;
            }

            .subtitle {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- Background glow -->
    <div class="glow"></div>

    <!-- =========================
         MUSIC
    ========================== -->

    <audio id="bgMusic" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>


    <!-- Floating Hearts -->

    <div class="floating-heart" style="left: 8%; animation-duration: 9s; animation-delay: 0s;">♡</div>
    <div class="floating-heart" style="left: 18%; animation-duration: 12s; animation-delay: 3s;">♥</div>
    <div class="floating-heart" style="left: 30%; animation-duration: 10s; animation-delay: 1s;">♡</div>
    <div class="floating-heart" style="left: 45%; animation-duration: 14s; animation-delay: 4s;">♥</div>
    <div class="floating-heart" style="left: 60%; animation-duration: 11s; animation-delay: 2s;">♡</div>
    <div class="floating-heart" style="left: 75%; animation-duration: 13s; animation-delay: 5s;">♥</div>
    <div class="floating-heart" style="left: 88%; animation-duration: 10s; animation-delay: 1s;">♡</div>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="container" id="mainContent">

        <div class="small-text">
            A little surprise
        </div>

        <h1>
            For My Love
        </h1>

        <div class="subtitle">
            Something special is waiting for you ♡
        </div>


        <!-- Heart -->

        <div class="heart-wrapper" onclick="startExperience()">

            <div class="heart">

                <div class="heart-highlight"></div>

            </div>

        </div>


        <div class="click-text">
            Tap the heart ♡
        </div>

    </main>


    <!-- Music button -->

    <button
        class="music-button"
        id="musicButton"
        onclick="toggleMusic(event)"
        aria-label="Toggle music">

        ♫

    </button>


    <script>

        /* =====================================
           MUSIC SYSTEM
        ===================================== */

        const music = document.getElementById("bgMusic");
        const musicButton = document.getElementById("musicButton");

        let musicStarted = false;


        /* Restore music position */

        const savedTime = localStorage.getItem("musicTime");

        if (savedTime) {

            music.currentTime = parseFloat(savedTime);

        }


        /* Save music position */

        setInterval(() => {

            if (!music.paused) {

                localStorage.setItem(
                    "musicTime",
                    music.currentTime
                );

            }

        }, 1000);


        /* Start music */

        function startMusic() {

            music.play()
                .then(() => {

                    musicStarted = true;

                    musicButton.innerHTML = "♫";

                })
                .catch(() => {

                    /*
                    Browser blocked autoplay.
                    The user can click the heart again.
                    */

                    musicButton.innerHTML = "🔇";

                });

        }


        /* Toggle music */

        function toggleMusic(event) {

            if (event) {
                event.stopPropagation();
            }

            if (music.paused) {

                startMusic();

            } else {

                music.pause();

                localStorage.setItem(
                    "musicTime",
                    music.currentTime
                );

                musicButton.innerHTML = "🔇";

            }

        }


        /* =====================================
           START PAGE 1
           Click Heart
        ===================================== */

        function startExperience() {

            /* Start music */

            if (music.paused) {

                startMusic();

            }


            /* Remember that music has started */

            localStorage.setItem(
                "musicStarted",
                "true"
            );


            /* Save current position */

            localStorage.setItem(
                "musicTime",
                music.currentTime
            );


            /* Page transition */

            const main = document.getElementById("mainContent");

            main.classList.add("fade-out");


            /* Go to Page 2 */

            setTimeout(() => {

                window.location.href = "page2.html";

            }, 1000);

        }


        /* =====================================
           STOP MUSIC WHEN PAGE/TAB IS CLOSED
        ===================================== */

        window.addEventListener("pagehide", () => {

            if (!music.paused) {

                localStorage.setItem(
                    "musicTime",
                    music.currentTime
                );

            }

        });


        /*
        When the browser/tab is actually closed,
        this audio element is destroyed automatically.

        We intentionally DO NOT automatically play
        music when Page 1 is opened again.
        */


        /* =====================================
           Prevent accidental context menu
           on the heart (optional)
        ===================================== */

        document.querySelector(".heart-wrapper")
            .addEventListener("contextmenu", function(event) {

                event.preventDefault();

            });

    </script>

</body>
</html>
