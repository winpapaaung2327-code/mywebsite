<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page 5</title>

    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }


        /* =========================================
           BODY / BLACK BACKGROUND
        ========================================= */

        body {

            background:
                radial-gradient(
                    circle at center,
                    #180000 0%,
                    #080000 35%,
                    #020202 70%,
                    #000000 100%
                );

            font-family: Arial, Helvetica, sans-serif;

            position: relative;
        }


        /* =========================================
           MAIN HEART AREA
        ========================================= */

        .heart-screen {

            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            display: flex;

            justify-content: center;
            align-items: center;

            overflow: hidden;
        }


        /* =========================================
           CANVAS
        ========================================= */

        #heartCanvas {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 1;
        }


        /* =========================================
           CENTER Z LETTER
        ========================================= */

        .z-letter {

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                scale(0.5);

            z-index: 5;

            color: #ff4444;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: clamp(22px, 3vw, 38px);

            font-weight: normal;

            letter-spacing: 2px;

            opacity: 0;

            text-shadow:

                0 0 5px #ff0000,

                0 0 12px #ff0000,

                0 0 25px rgba(255, 0, 0, 0.8);

            transition:

                opacity 2s ease,

                transform 2s ease;
        }


        /* =========================================
           Z APPEARS AT THE END
        ========================================= */

        .z-letter.show {

            opacity: 1;

            transform:
                translate(-50%, -50%)
                scale(1);
        }


        /* =========================================
           BACK TO PAGE 4 BUTTON
        ========================================= */

        .back-button {

            position: fixed;

            top: 20px;
            right: 20px;

            z-index: 20;

            text-decoration: none;

            color: #ff3333;

            border: 1px solid
                rgba(255, 40, 40, 0.8);

            background:
                rgba(0, 0, 0, 0.55);

            padding: 9px 18px;

            border-radius: 25px;

            font-size: 13px;

            transition: 0.3s;

            backdrop-filter: blur(5px);
        }


        .back-button:hover {

            color: white;

            background: #9e0000;

            border-color: #ff0000;

            box-shadow:

                0 0 12px #ff0000,

                0 0 25px
                rgba(255, 0, 0, 0.6);

            transform: scale(1.05);
        }


        /* =========================================
           MUSIC BUTTON
        ========================================= */

        .music-button {

            position: fixed;

            right: 22px;
            bottom: 22px;

            width: 43px;
            height: 43px;

            z-index: 20;

            border-radius: 50%;

            border: 1px solid #ff2020;

            background:
                rgba(0, 0, 0, 0.7);

            color: #ff3030;

            font-size: 17px;

            cursor: pointer;

            box-shadow:
                0 0 10px
                rgba(255, 0, 0, 0.35);

            transition: 0.3s;
        }


        .music-button:hover {

            color: white;

            background: #990000;

            box-shadow:

                0 0 15px #ff0000,

                0 0 30px
                rgba(255, 0, 0, 0.6);
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .back-button {

                top: 12px;
                right: 12px;

                padding: 7px 13px;

                font-size: 11px;
            }

            .music-button {

                width: 40px;
                height: 40px;

                right: 15px;
                bottom: 15px;
            }

        }

    </style>
</head>


<body>


    <!-- =========================================
         FULL SCREEN HEART
    ========================================= -->

    <div class="heart-screen">

        <canvas id="heartCanvas"></canvas>


        <!-- Z appears at the end -->

        <div class="z-letter" id="zLetter">
            Z
        </div>

    </div>


    <!-- =========================================
         PAGE 4 LINK
    ========================================= -->

    <a
        href="page4.html"
        class="back-button"
    >
        ← Page 4
    </a>


    <!-- =========================================
         MUSIC BUTTON
    ========================================= -->

    <button
        class="music-button"
        id="musicButton"
    >
        ♪
    </button>


    <!-- =========================================
         MUSIC
    ========================================= -->

    <audio
        id="music"
        autoplay
        loop
    >

        <source
            src="music4.mp3"
            type="audio/mpeg"
        >

    </audio>



<script>

/* =================================================
   CANVAS SETUP
================================================= */

const canvas =
    document.getElementById("heartCanvas");

const ctx =
    canvas.getContext("2d");

let width;
let height;

let particles = [];

let heartTargets = [];

let animationStart = null;

let heartFinished = false;


/* =================================================
   RESIZE
================================================= */

function resizeCanvas() {

    const dpr =
        window.devicePixelRatio || 1;

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    createHeart();

}

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =================================================
   HEART EQUATION
================================================= */

function heartEquation(t, scale) {

    const x =
        16 *
        Math.pow(
            Math.sin(t),
            3
        );

    const y =
        13 *
        Math.cos(t)
        -
        5 *
        Math.cos(2 * t)
        -
        2 *
        Math.cos(3 * t)
        -
        Math.cos(4 * t);


    return {

        x: x * scale,

        y: -y * scale

    };

}


/* =================================================
   CREATE HEART PARTICLE TARGETS
================================================= */

function createHeart() {

    heartTargets = [];


    /*
       Make heart slightly smaller
       so it fits beautifully in center.
    */

    const scale =
        Math.min(
            width,
            height
        ) / 43;


    const centerX =
        width / 2;


    const centerY =
        height / 2;


    /* ---------------------------------------------
       OUTLINE
    --------------------------------------------- */

    for (
        let i = 0;
        i < 1200;
        i++
    ) {

        const t =
            Math.random() *
            Math.PI *
            2;


        const heart =
            heartEquation(
                t,
                scale
            );


        const spread =
            Math.random() *
            8;


        heartTargets.push({

            x:
                centerX +
                heart.x +
                (Math.random() - 0.5) *
                spread,

            y:
                centerY +
                heart.y +
                (Math.random() - 0.5) *
                spread

        });

    }


    /* ---------------------------------------------
       INSIDE HEART
    --------------------------------------------- */

    for (
        let i = 0;
        i < 1800;
        i++
    ) {

        const t =
            Math.random() *
            Math.PI *
            2;


        const heart =
            heartEquation(
                t,
                scale
            );


        /*
           Random distance toward center
           creates a filled particle heart.
        */

        const amount =
            Math.sqrt(
                Math.random()
            );


        heartTargets.push({

            x:
                centerX +
                heart.x *
                amount,

            y:
                centerY +
                heart.y *
                amount

        });

    }


    createParticles();

}


/* =================================================
   PARTICLE CLASS
================================================= */

class Particle {

    constructor(target) {

        this.targetX =
            target.x;

        this.targetY =
            target.y;


        /*
           Start from random positions
        */

        this.x =
            Math.random() *
            width;


        this.y =
            Math.random() *
            height;


        this.size =
            Math.random() *
            1.8 +
            0.5;


        this.speed =
            Math.random() *
            0.025 +
            0.015;


        this.alpha =
            Math.random() *
            0.7 +
            0.3;


        this.twinkle =
            Math.random() *
            Math.PI *
            2;


        this.delay =
            Math.random() *
            1500;


        this.color =
            this.getColor();

    }


    /* ---------------------------------------------
       RED PARTICLE COLORS
    --------------------------------------------- */

    getColor() {

        const colors = [

            "#ff0000",

            "#ff1111",

            "#ff2222",

            "#ff3333",

            "#ff4444",

            "#ff5555",

            "#ff7777",

            "#cc0000",

            "#990000"

        ];


        return colors[
            Math.floor(
                Math.random() *
                colors.length
            )
        ];

    }


    /* ---------------------------------------------
       UPDATE
    --------------------------------------------- */

    update(elapsed) {

        /*
           Wait slightly before moving.
           This makes the heart build naturally.
        */

        if (
            elapsed <
            this.delay
        ) {

            return;

        }


        const dx =
            this.targetX -
            this.x;


        const dy =
            this.targetY -
            this.y;


        this.x +=
            dx *
            this.speed;


        this.y +=
            dy *
            this.speed;


        /*
           Tiny floating movement
        */

        this.x +=
            Math.sin(
                elapsed * 0.002 +
                this.twinkle
            ) *
            0.08;


        this.y +=
            Math.cos(
                elapsed * 0.002 +
                this.twinkle
            ) *
            0.08;

    }


    /* ---------------------------------------------
       DRAW
    --------------------------------------------- */

    draw(elapsed) {

        if (
            elapsed <
            this.delay
        ) {

            return;

        }


        const twinkle =
            0.75 +
            Math.sin(
                elapsed * 0.006 +
                this.twinkle
            ) *
            0.25;


        ctx.globalAlpha =
            this.alpha *
            twinkle;


        ctx.fillStyle =
            this.color;


        ctx.beginPath();


        ctx.arc(

            this.x,

            this.y,

            this.size,

            0,

            Math.PI * 2

        );


        ctx.fill();


        /*
           Some particles get stronger glow
        */

        if (
            this.size >
            1.5
        ) {

            ctx.shadowBlur =
                8;

            ctx.shadowColor =
                "#ff0000";

            ctx.fill();

            ctx.shadowBlur =
                0;

        }

    }

}


/* =================================================
   CREATE PARTICLES
================================================= */

function createParticles() {

    particles = [];


    for (
        let i = 0;
        i < heartTargets.length;
        i++
    ) {

        particles.push(

            new Particle(
                heartTargets[i]
            )

        );

    }

}


/* =================================================
   EXTRA FLOATING RED PARTICLES
================================================= */

let backgroundParticles = [];


function createBackgroundParticles() {

    backgroundParticles = [];


    for (
        let i = 0;
        i < 180;
        i++
    ) {

        backgroundParticles.push({

            x:
                Math.random() *
                width,

            y:
                Math.random() *
                height,

            size:
                Math.random() *
                1.5 +
                0.2,

            speed:
                Math.random() *
                0.25 +
                0.05,

            alpha:
                Math.random() *
                0.35 +
                0.05

        });

    }

}


function drawBackgroundParticles() {

    for (
        const p of backgroundParticles
    ) {

        p.y -= p.speed;


        if (
            p.y < 0
        ) {

            p.y =
                height;

        }


        ctx.globalAlpha =
            p.alpha;


        ctx.fillStyle =
            "#ff2222";


        ctx.beginPath();


        ctx.arc(

            p.x,

            p.y,

            p.size,

            0,

            Math.PI * 2

        );


        ctx.fill();

    }

}


/* =================================================
   HEART GLOW
================================================= */

function drawGlow() {

    const centerX =
        width / 2;


    const centerY =
        height / 2;


    const radius =
        Math.min(
            width,
            height
        ) *
        0.32;


    const gradient =
        ctx.createRadialGradient(

            centerX,
            centerY,

            0,

            centerX,
            centerY,

            radius

        );


    gradient.addColorStop(

        0,

        "rgba(255,0,0,0.13)"

    );


    gradient.addColorStop(

        0.45,

        "rgba(255,0,0,0.05)"

    );


    gradient.addColorStop(

        1,

        "rgba(255,0,0,0)"

    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(

        0,
        0,
        width,
        height

    );

}


/* =================================================
   SHOW Z LETTER
================================================= */

function showZ() {

    if (
        heartFinished
    ) {

        return;

    }


    heartFinished = true;


    const z =
        document.getElementById(
            "zLetter"
        );


    /*
       Z appears AFTER heart
       has finished forming.
    */

    setTimeout(
        function() {

            z.classList.add(
                "show"
            );

        },
        800
    );

}


/* =================================================
   ANIMATION
================================================= */

function animate(timestamp) {

    if (
        !animationStart
    ) {

        animationStart =
            timestamp;

    }


    const elapsed =
        timestamp -
        animationStart;


    ctx.clearRect(

        0,
        0,
        width,
        height

    );


    /*
       Background glow
    */

    drawGlow();


    /*
       Small floating particles
    */

    drawBackgroundParticles();


    /*
       Main heart
    */

    for (
        const particle
        of particles
    ) {

        particle.update(
            elapsed
        );

        particle.draw(
            elapsed
        );

    }


    ctx.globalAlpha =
        1;


    /*
       After about 4.8 seconds
       show Z
    */

    if (
        elapsed >
        4800
    ) {

        showZ();

    }


    requestAnimationFrame(
        animate
    );

}


/* =================================================
   START EVERYTHING
================================================= */

resizeCanvas();

createBackgroundParticles();

requestAnimationFrame(
    animate
);


/* =================================================
   MUSIC
================================================= */

const music =
    document.getElementById(
        "music"
    );


const musicButton =
    document.getElementById(
        "musicButton"
    );


music.volume =
    0.65;


/*
   Try automatic music
*/

window.addEventListener(
    "load",
    function() {

        const playPromise =
            music.play();


        if (
            playPromise !== undefined
        ) {

            playPromise.catch(
                function() {

                    /*
                       Chrome may block
                       autoplay with sound.

                       User can click
                       the music button.
                    */

                    musicButton.innerHTML =
                        "▶";

                }
            );

        }

    }
);


/*
   Music button
*/

musicButton.addEventListener(
    "click",
    function() {

        if (
            music.paused
        ) {

            music.play();

            musicButton.innerHTML =
                "❚❚";

        }

        else {

            music.pause();

            musicButton.innerHTML =
                "▶";

        }

    }
);


/*
   Keep icon synchronized
*/

music.addEventListener(
    "play",
    function() {

        musicButton.innerHTML =
            "❚❚";

    }
);


music.addEventListener(
    "pause",
    function() {

        musicButton.innerHTML =
            "▶";

    }
);

</script>

</body>
</html>
